<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
</head>
<body>
    
    <div class="container w-50">
        <h2 class="text-center">Add Book</h2>
        <form action="" onsubmit="sendBookData(event)">
        <input type="text" name="bookId" class="form-control my-3" placeholder="Book ID">
        <input type="text" name="name" class="form-control my-3" placeholder="Book Name">
        <input type="text" name="author" class="form-control my-3" placeholder="Book Author">
        <label for="">Category</label>
        <select name="category" class="form-select my-3">
            <option value="fiction">Fiction</option> 
            <option value="non-fiction">Non-Fiction</option>
        </select>
        <input type="text" name="imgUrl" class="form-control my-3" placeholder="Book image URL">
        <input type="number" name="price" class="form-control my-3" placeholder="Book Price">
        <input type="number" name="stockCount" class="form-control my-3" placeholder="Book Count">
        <input type="submit" value="Add Book" class="btn btn-primary w-100">
    </form>
    </div>

    <script>
        async function sendBookData(e){
            e.preventDefault(); // it stops page reloder

            const newBook = {

                bookId: e.target[0].value,
                name:  e.target[1].value,
                author:  e.target[2].value,
                category:  e.target[3].value,
                imgUrl:  e.target[4].value,
                price:  e.target[5].value,
                stockCount:  e.target[6].value,
            }

            // console.log(newBook);

            const res = await fetch('http://localhost:8081/api/books', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(newBook)
            })

            const data = await res.json();

            console.log(data);
            

            if(data.bookId == newBook.bookId)
            alert('added successfully')
            else if(data.bookId == null)
            alert('The given book already exists')
            
        }
    </script>
</body>
</html>
