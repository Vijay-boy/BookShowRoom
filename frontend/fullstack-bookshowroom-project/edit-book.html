<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
    <div class="container w-50">
        <h2 class="text-center">Edit Book</h2>
        <input type="text" name="bookId" id="bookId" class="form-control my-3" placeholder="Book ID" readonly>
        <input type="text" name="name" id="name" class="form-control my-3" placeholder="Book Name">
        <input type="text" name="author" id="author" class="form-control my-3" placeholder="Book Author">
        <label for="">Category</label>
        <select name="category" id="category" class="form-select my-3">
            <option value="fiction">Fiction</option> 
            <option value="non-fiction">Non-Fiction</option>
        </select>
        <input type="text" name="imgUrl" id="imgUrl" class="form-control my-3" placeholder="Book image URL">
        <input type="number" name="price" id="price" class="form-control my-3" placeholder="Book Price">
        <input type="number" name="stockCount" id="stockCount" class="form-control my-3" placeholder="Book Count">
        <button class="btn btn-info w-100" onclick="editBook()">Edit</button>
    </div>

    <script>

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        async function loadBook(){
            const res = await fetch(`http://localhost:8081/api/books/${id}`);
            const book = await res.json();

            document.getElementById("bookId").value = book.bookId;
            document.getElementById("name").value = book.name;
            document.getElementById("author").value = book.author;
            document.getElementById("category").value = book.category;
            document.getElementById("imgUrl").value = book.imgUrl;
            document.getElementById("price").value = book.price;
            document.getElementById("stockCount").value = book.stockCount;
        }
        loadBook();

        async function editBook(){
            const book = {
                bookId: parseInt(id),
                name: document.getElementById("name").value,
                author: document.getElementById("author").value,
                category: document.getElementById("category").value,
                imgUrl: document.getElementById("imgUrl").value,
                price: parseFloat(document.getElementById("price").value),
                stockCount: parseInt(document.getElementById("stockCount").value)
            };

            await fetch(`http://localhost:8081/api/books/${id}`, {
                method: 'PUT',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(book)
            });

            window.location.href = "crud-dashboard.html";
        }
        
    </script>
</body>
</html>
